server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;

    # The 2026-09-26 restructure folded oeuvres, vetements and installations
    # into the portfolio landing page. Those three URLs were published, so they
    # redirect rather than 404 — a permanent move, not a dead end.
    location = /oeuvres      { return 301 /; }
    location = /oeuvres.html { return 301 /; }
    location = /vetements      { return 301 /; }
    location = /vetements.html { return 301 /; }
    location = /installations      { return 301 /; }
    location = /installations.html { return 301 /; }

    # The old multi-page URLs now live as sections of the one-scroll landing page.
    location = /atelier       { return 301 /#atelier; }
    location = /atelier.html  { return 301 /#atelier; }
    location = /apropos       { return 301 /#apropos; }
    location = /apropos.html  { return 301 /#apropos; }
    location = /contact       { return 301 /#contact; }
    location = /contact.html  { return 301 /#contact; }

    # static export: /foo -> foo.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Images are content-addressed by their crop; they change only when the
    # studio sends new photography, so cache them hard.
    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # CSS and JS change with every design pass — revalidate.
    # Vite's hashed build output: the filename changes when the content does.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /404.html { internal; }
    error_page 404 /index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript image/svg+xml;

    # JPEGs are already compressed; gzipping them just burns CPU.
    server_tokens     off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
