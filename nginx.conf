server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;

    # /oeuvres and /oeuvres.html should both work
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Images are content-addressed by their crop; they change only when the
    # studio sends new photography, so cache them hard.
    location /assets/img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # CSS and JS change with every design pass — revalidate.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location = /404.html { internal; }
    error_page 404 /index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript image/svg+xml;

    # JPEGs are already compressed; gzipping them just burns CPU.
    server_tokens     off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
