<main>
<section class="works" id="works" aria-label="Œuvres">
  <div class="row">
    <button class="w" style="--ar:0.709" type="button"
            data-full="assets/img/oeuvres/ivresse-ecarlate.jpg"
            data-title="« Ivresse écarlate »"
            data-detail="Créton, popeline, tissu sky — 180 × 180 cm">
      <img src="assets/img/oeuvres/ivresse-ecarlate.jpg" width="968" height="1365" fetchpriority="high" decoding="async"
           alt="Intérieur tamisé baigné d'une lumière orange, sol en damier noir et or et palmier en ombre chinoise.">
      <span class="w__cap"><b>« Ivresse écarlate »</b><i>Créton, popeline, tissu sky — 180 × 180 cm</i></span>
    </button>

    <button class="w" style="--ar:2.527" type="button"
            data-full="assets/img/oeuvres/apprentis-sages.jpg"
            data-title="« Apprentis Sages »"
            data-detail="Popeline, cretonne — 100 × 50 cm">
      <img src="assets/img/oeuvres/apprentis-sages.jpg" width="1400" height="554" fetchpriority="high" decoding="async"
           alt="Triptyque en ombres chinoises : trois silhouettes de karatékas en mouvement.">
      <span class="w__cap"><b>« Apprentis Sages »</b><i>Popeline, cretonne — 100 × 50 cm</i></span>
    </button>

  </div>

  <div class="row">
    <button class="w" style="--ar:0.596" type="button"
            data-full="assets/img/oeuvres/accords-vitamines.jpg"
            data-title="« Accords vitaminés »"
            data-detail="Popeline, tissu « sky », crétonne, perles — 105 × 65 cm">
      <img src="assets/img/oeuvres/accords-vitamines.jpg" width="796" height="1335" loading="lazy" decoding="async"
           alt="Tapisserie où une guitare devient un avocatier, sur un parterre de pétales pourpres.">
      <span class="w__cap"><b>« Accords vitaminés »</b><i>Popeline, tissu « sky », crétonne, perles — 105 × 65 cm</i></span>
    </button>

    <button class="w" style="--ar:0.752" type="button"
            data-full="assets/img/oeuvres/architecture-eau.jpg"
            data-title="L'architecture de l'eau"
            data-detail="Mosaïque en jeans — recyclées, découpées, assemblées">
      <img src="assets/img/oeuvres/architecture-eau.jpg" width="931" height="1238" loading="lazy" decoding="async"
           alt="Grande mosaïque murale composée de tessons de jean dans des bleus délavés.">
      <span class="w__cap"><b>L'architecture de l'eau</b><i>Mosaïque en jeans — recyclées, découpées, assemblées</i></span>
    </button>

    <button class="w" style="--ar:0.547" type="button"
            data-full="assets/img/oeuvres/mosaique-portee.jpg"
            data-title="L'architecture de l'eau"
            data-detail="L'envers de la tapisserie, chaque pièce numérotée et brodée à la main">
      <img src="assets/img/oeuvres/mosaique-portee.jpg" width="733" height="1340" loading="lazy" decoding="async"
           alt="Une artisane déploie la mosaïque en jeans pour en montrer l'envers.">
      <span class="w__cap"><b>L'architecture de l'eau</b><i>L'envers de la tapisserie, chaque pièce numérotée et brodée à la main</i></span>
    </button>

    <button class="w" style="--ar:0.616" type="button"
            data-full="assets/img/oeuvres/ivresse-ecarlate-situ.jpg"
            data-title="« Ivresse écarlate »"
            data-detail="Ombres chinoises, en situation">
      <img src="assets/img/oeuvres/ivresse-ecarlate-situ.jpg" width="763" height="1238" loading="lazy" decoding="async"
           alt="La tenture « Ivresse écarlate » installée dans une pièce, une personne assise devant.">
      <span class="w__cap"><b>« Ivresse écarlate »</b><i>Ombres chinoises, en situation</i></span>
    </button>

    <button class="w" style="--ar:0.904" type="button"
            data-full="assets/img/oeuvres/pieces-decoupees.jpg"
            data-title="Pièces découpées"
            data-detail="Trèfle, cœur et pique — la mécanique de guitare">
      <img src="assets/img/oeuvres/pieces-decoupees.jpg" width="320" height="354" loading="lazy" decoding="async"
           alt="Pièces de feutrine découpées en forme de trèfle, de cœur et de pique sur un plan de travail.">
      <span class="w__cap"><b>Pièces découpées</b><i>Trèfle, cœur et pique — la mécanique de guitare</i></span>
    </button>

  </div>

</section>
</main>

<footer class="foot" id="contact">
  <form class="news" id="news" novalidate>
    <label for="email">Recevoir des nouvelles de l'atelier</label>
    <div class="news__row">
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="votre@email.com">
      <button type="submit">S'inscrire</button>
    </div>
    <p class="news__msg" id="news-msg" role="status" aria-live="polite"></p>
  </form>

  <div class="foot__rule"></div>

  <span class="foot__glyph" aria-hidden="true">
    <svg viewBox="0 0 120 70" focusable="false">
      <circle cx="46" cy="14" r="6.5" fill="currentColor"/>
      <path d="M6 52 L58 40 L70 26 L82 50 L96 30 L112 44" fill="none"
            stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>

  <p class="foot__line">
    <a href="mailto:omara@resone.africa">omara@resone.africa</a>
    <a href="mailto:ines@resone.africa">ines@resone.africa</a>
    <a href="https://instagram.com/beautyssspot" rel="noopener">@beautyssspot</a>
  </p>

  <p class="foot__fine">Atelier — Riviera 3, Abidjan, Côte d'Ivoire</p>
  <p class="foot__fine">© <span id="year">2026</span> Résone — l'art de faire résonner · Crédit photo : Résone</p>
</footer>

<dialog class="lb" id="lb" closedby="any" aria-label="Œuvre en taille réelle">
  <button class="lb__x" type="button" data-lb-close aria-label="Fermer">&times;</button>
  <button class="lb__nav lb__nav--prev" type="button" data-lb-prev aria-label="Œuvre précédente">&#8249;</button>
  <button class="lb__nav lb__nav--next" type="button" data-lb-next aria-label="Œuvre suivante">&#8250;</button>
  <figure class="lb__fig">
    <img class="lb__img" id="lb-img" alt="">
    <figcaption class="lb__cap">
      <span class="lb__title" id="lb-title"></span>
      <span class="lb__detail" id="lb-detail"></span>
    </figcaption>
  </figure>
</dialog>
