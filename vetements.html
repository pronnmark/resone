<section class="works" id="works" aria-label="Œuvres">
  <div class="row">

            data-full="assets/img/vetements/elephant-print.jpg"

      <img src="assets/img/vetements/elephant-print.jpg" width="695" height="581" fetchpriority="high" decoding="async"
           alt="Haut jaune safran à manches courtes, empiècements patchwork en denim aux épaules.">

    <button class="w" style="--ar:0.759" type="button"

      <img src="assets/img/vetements/fee-des-jeans.jpg" width="931" height="1227" fetchpriority="high" decoding="async"

    </button>

    <button class="w" style="--ar:0.739" type="button"
            data-full="assets/img/vetements/fee-des-jeans-dos.jpg"
            data-title="« Fée des jeans »"
            data-detail="Dos, empiècement denim">
      <img src="assets/img/vetements/fee-des-jeans-dos.jpg" width="896" height="1213" fetchpriority="high" decoding="async"
           alt="Dos du t-shirt « fée des jeans », empiècement patchwork sur les manches.">

  </div>

  <div class="row">
    <button class="w" style="--ar:1.201" type="button"
            data-full="assets/img/vetements/haut-peche.jpg"

           alt="Haut couleur pêche à manches patchwork en denim et popeline.">

    </button>

    <button class="w" style="--ar:1.000" type="button"
            data-full="assets/img/vetements/haut-peche-poche.jpg"

           alt="Haut pêche vu de face, poche plaquée et ceinture nouée.">

    <button class="w" style="--ar:0.867" type="button"
            data-full="assets/img/vetements/ensemble-peche.jpg"

            data-detail="Panneau patchwork denim">

      <span class="w__cap"><b>Pochette &amp; ensemble</b><i>Créton jeans</i></span>
    </button>

    <button class="w" style="--ar:1.000" type="button"
            data-full="assets/img/vetements/detail-denim.jpg"
            data-title="Détail"
            data-detail="Assemblage denim et popeline">
      <img src="assets/img/vetements/detail-denim.jpg" width="717" height="717" loading="lazy" decoding="async"
           alt="Détail d'assemblage : pièces de denim et de popeline cousues bord à bord.">
      <span class="w__cap"><b>Détail</b><i>Assemblage denim et popeline</i></span>
    </button>

    <button class="w" style="--ar:0.749" type="button"
            data-full="assets/img/vetements/tablier-eventail.jpg"
            data-title="Le tablier de l'artisan"
            data-detail="Patchwork signature personnalisé">
      <img src="assets/img/vetements/tablier-eventail.jpg" width="1048" height="1400" loading="lazy" decoding="async"
           alt="Tablier d'artisan en denim à patchwork rose et bordeaux, présenté avec un éventail.">
      <span class="w__cap"><b>Le tablier de l'artisan</b><i>Patchwork signature personnalisé</i></span>
    </button>

    <button class="w" style="--ar:1.146" type="button"
            data-full="assets/img/vetements/tablier.jpg"
            data-title="Le tablier de l'artisan"
            data-detail="Sur mesure — 175 000 FCFA">
      <img src="assets/img/vetements/tablier.jpg" width="1238" height="1080" loading="lazy" decoding="async"
           alt="Tablier d'artisan en polycoton bleu marine, orné d'un patchwork géométrique.">
      <span class="w__cap"><b>Le tablier de l'artisan</b><i>Sur mesure — 175 000 FCFA</i></span>
    </button>
