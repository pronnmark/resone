    <button class="w" style="--ar:0.709" type="button"
            data-full="assets/img/oeuvres/ivresse-ecarlate.jpg"

           alt="Intérieur tamisé baigné d'une lumière orange, sol en damier noir et or et palmier en ombre chinoise.">

    <button class="w" style="--ar:0.752" type="button"
            data-full="assets/img/oeuvres/architecture-eau.jpg"

      <img src="assets/img/oeuvres/architecture-eau.jpg" width="931" height="1238" fetchpriority="high" decoding="async"
           alt="Grande mosaïque murale composée de tessons de jean dans des bleus délavés.">

      <img src="assets/img/installations/hanoka-maria.jpg" width="1310" height="1333" fetchpriority="high" decoding="async"
           alt="Une enfant tient un éventail devant HANOKA, panneau textile mural aux briques roses et bleues.">

    </button>

    <button class="w" style="--ar:0.948" type="button"

      <img src="assets/img/vetements/jupe-denim.jpg" width="1283" height="1353" loading="lazy" decoding="async"
           alt="Haut jaune et jupe en denim noir portant le grain de beauté brodé.">
      <span class="w__cap"><b>Ensemble jupe denim</b><i>Grain de beauté brodé</i></span>
    </button>

  </div>

  <div class="row">
    <button class="w" style="--ar:1.195" type="button"
            data-full="assets/img/atelier/soeurs-re.jpg"
            data-title="Les sœurs Ré"
            data-detail="Omara Ré &amp; Inès Ré">
      <img src="assets/img/atelier/soeurs-re.jpg" width="1191" height="997" loading="lazy" decoding="async"

      <span class="w__cap"><b>Les sœurs Ré</b><i>Omara Ré &amp; Inès Ré</i></span>
    </button>

            data-full="assets/img/installations/decors-architecture.jpg"

      <span class="w__cap"><b>Décors inspirés de l'architecture</b><i>Pans de murs textiles</i></span>
    </button>

    <button class="w" style="--ar:0.547" type="button"
            data-full="assets/img/oeuvres/mosaique-portee.jpg"
            data-title="L'architecture de l'eau"
            data-detail="L'envers de la tapisserie, chaque pièce numérotée et brodée à la main">
      <img src="assets/img/oeuvres/mosaique-portee.jpg" width="733" height="1340" loading="lazy" decoding="async"

      <span class="w__cap"><b>L'architecture de l'eau</b><i>L'envers de la tapisserie, chaque pièce numérotée et brodée à la main</i></span>

            data-full="assets/img/vetements/fee-des-jeans.jpg"
            data-title="« Fée des jeans »"
            data-detail="Patchwork signature vêtement">

      <span class="w__cap"><b>« Fée des jeans »</b><i>Patchwork signature vêtement</i></span>
