<main>
<section class="works" id="works" aria-label="Œuvres">
  <div class="row">
    <button class="w" style="--ar:1.195" type="button"
            data-full="assets/img/atelier/soeurs-re.jpg"
            data-title="Les sœurs Ré"
            data-detail="Omara Ré &amp; Inès Ré">
      <img src="assets/img/atelier/soeurs-re.jpg" width="1191" height="997" fetchpriority="high" decoding="async"
           alt="Omara et Inès Ré face à face, en discussion autour d'un carnet et d'une tasse.">
      <span class="w__cap"><b>Les sœurs Ré</b><i>Omara Ré &amp; Inès Ré</i></span>
    </button>

    <button class="w" style="--ar:1.036" type="button"
            data-full="assets/img/atelier/ines-decoupe.jpg"
            data-title="Inès Ré"
            data-detail="La découpe, à contre-jour">
      <img src="assets/img/atelier/ines-decoupe.jpg" width="1214" height="1172" fetchpriority="high" decoding="async"
           alt="Inès Ré à l'atelier, penchée sur une découpe textile devant une fenêtre à contre-jour.">
      <span class="w__cap"><b>Inès Ré</b><i>La découpe, à contre-jour</i></span>
    </button>

    <button class="w" style="--ar:0.561" type="button"
            data-full="assets/img/atelier/couture.jpg"
            data-title="Quatre-mains"
            data-detail="Assemblage du patchwork">
      <img src="assets/img/atelier/couture.jpg" width="766" height="1366" loading="lazy" decoding="async"
           alt="Une artisane en haut rouge assemble à la main un patchwork géométrique.">
      <span class="w__cap"><b>Quatre-mains</b><i>Assemblage du patchwork</i></span>
    </button>

  </div>

  <div class="row">
    <button class="w" style="--ar:1.260" type="button"
            data-full="assets/img/atelier/outils.jpg"
            data-title="Les outils"
            data-detail="Ciseaux, aiguille, fils">
      <img src="assets/img/atelier/outils.jpg" width="378" height="300" loading="lazy" decoding="async"
           alt="Ciseaux de couturière, aiguille et deux bobines de fil rouge et bleu.">
      <span class="w__cap"><b>Les outils</b><i>Ciseaux, aiguille, fils</i></span>
    </button>

    <button class="w" style="--ar:1.710" type="button"
            data-full="assets/img/atelier/eventail.jpg"
            data-title="L'éventail"
            data-detail="Accessoire scénographique">
      <img src="assets/img/atelier/eventail.jpg" width="484" height="283" loading="lazy" decoding="async"
           alt="Éventail en papier plissé, ouvert.">
      <span class="w__cap"><b>L'éventail</b><i>Accessoire scénographique</i></span>
    </button>

    <button class="w" style="--ar:1.757" type="button"
            data-full="assets/img/atelier/reference-ines.jpg"
            data-title="Créative Côte d'Ivoire"
            data-detail="Incubation 2026 — Ministère de la Culture">
      <img src="assets/img/atelier/reference-ines.jpg" width="1400" height="797" loading="lazy" decoding="async"
           alt="Inès Ré présentant Résone sur scène lors du programme Créative Côte d'Ivoire.">
      <span class="w__cap"><b>Créative Côte d'Ivoire</b><i>Incubation 2026 — Ministère de la Culture</i></span>
    </button>

  </div>

</section>

      <input id="email" name="email" type="email" autocomplete="email" required placeholder="votre@email.com">
      <button type="submit">S'inscrire</button>
    </div>
    <p class="news__msg" id="news-msg" role="status" aria-live="polite"></p>
  </form>

  <div class="foot__rule"></div>

  <span class="foot__glyph" aria-hidden="true">
    <svg viewBox="0 0 120 70" focusable="false">

      <path d="M6 52 L58 40 L70 26 L82 50 L96 30 L112 44" fill="none"
            stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>

  <p class="foot__line">
    <a href="mailto:omara@resone.africa">omara@resone.africa</a>
